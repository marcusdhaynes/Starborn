<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      // Gracefully intercept and suppress MetaMask, Ethereum, or Web3 extension injection / connection errors
      // that commonly trigger inside sandboxed iframe previews in the AI Studio environment.
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        if (
          msg.indexOf('MetaMask') !== -1 || 
          msg.indexOf('metamask') !== -1 || 
          msg.indexOf('Ethereum') !== -1 || 
          msg.indexOf('ethereum') !== -1 ||
          msg.indexOf('Web3') !== -1 ||
          msg.indexOf('web3') !== -1
        ) {
          console.warn('[MetaMask/Extension Interceptor] Prevented extension propagation error:', msg);
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = reason ? (reason.message || String(reason)) : '';
        if (
          msg.indexOf('MetaMask') !== -1 || 
          msg.indexOf('metamask') !== -1 || 
          msg.indexOf('Ethereum') !== -1 || 
          msg.indexOf('ethereum') !== -1 ||
          msg.indexOf('Web3') !== -1 ||
          msg.indexOf('web3') !== -1
        ) {
          console.warn('[MetaMask/Extension Interceptor] Suppressed unhandled rejection:', msg);
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
